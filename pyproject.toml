[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xcpc-vp-helper"
version = "0.1.22"
description = "Ubuntu virtual contest terminal and Universal Cup team contest helper"
requires-python = ">=3.12"
dependencies = ["requests>=2.31,<3", "beautifulsoup4>=4.12,<5", "rich>=13.7,<15", "curl_cffi>=0.16,<1"]

[project.scripts]
vp = "vp_helper.cli:main"
ucup = "vp_helper.cli:ucup_main"
printfile = "vp_helper.printfile:main"

[tool.setuptools.packages.find]
include = ["vp_helper*"]
