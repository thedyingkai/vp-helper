[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xcpc-vp-helper"
version = "0.1.8"
description = "Ubuntu QOJ, Codeforces contest and Gym virtual contest terminal"
requires-python = ">=3.12"
dependencies = ["requests>=2.31,<3", "beautifulsoup4>=4.12,<5", "rich>=13.7,<15", "curl_cffi>=0.11,<1"]

[project.scripts]
vp = "vp_helper.cli:main"

[tool.setuptools.packages.find]
include = ["vp_helper*"]
